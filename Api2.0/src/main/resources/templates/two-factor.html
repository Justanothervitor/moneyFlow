<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }
        .content {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 10px 10px;
        }
        .code-box {
            background: white;
            border: 3px solid #4facfe;
            padding: 25px;
            text-align: center;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .code {
            font-size: 36px;
            font-weight: bold;
            color: #4facfe;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
        }
        .timer {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🔐 Autenticação em Dois Fatores</h1>
</div>

<div class="content">
    <p>Olá, <strong th:text="${userName}">Usuário</strong>!</p>

    <p>Detectamos uma tentativa de login na sua conta. Use o código abaixo para continuar:</p>

    <div class="code-box">
        <div class="code" th:text="${code}">123456</div>
        <div class="timer">⏱️ Válido por <span th:text="${expiryMinutes}">10</span> minutos</div>
    </div>

    <p><strong>Não foi você?</strong> Ignore este email e considere alterar sua senha.</p>
</div>
</body>
</html>
