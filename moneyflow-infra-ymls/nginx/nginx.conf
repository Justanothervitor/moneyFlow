server{
  listen 80;
  server_name money-flow.app www.money-flow.app

  location /.well-know/acme-challenge/{
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
   }

}

server{
  listen 443 ssl;
  http2 on;
  server_name money-flow.app www.money-flow.app;

  ssl_certificate /etc/letsencrypt/live/money-flow.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/money-flow.app/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  location /api/{
  proxy_pass http://api:8888;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x__forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 60s;
  proxy_read_timeout 60s;
  }

  location /{
   proxy_pass http://angular:80;
   proxy_http_version 1.1;
   proxy_set_header   Host              $host;
   proxy_set_header   X-Real-IP         $remote_addr;
   proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
   proxy_set_header   X-Forwarded-Proto $scheme;
  }

}
