services:

  database:
    image: 'docker.io/postgres:latest'
    container_name: moneyflow-database-prod
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
      PGDATA: /var/lib/postgresql/data/pgdata
    # sem ports — banco não exposto no host em produção
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      command: >
          postgres
          -c shared_buffers=32MB
          -c work_mem=4MB
          -c maintenance_work_mem=16MB
          -c max_connections=20
          -c effective_cache_size=128MB
          -c wal_buffers=4MB
          -c checkpoint_completion_target=0.9
          -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 96M
        reservations:
          memory: 64M
    networks:
      - backend

  api:
    container_name: moneyflow-api-prod
    build:
      dockerfile: Dockerfile
      context: Api2.0
    restart: unless-stopped
    environment:
      - 'SPRING_APPLICATION_NAME=Api2.0'
      - 'SPRING_FLYWAY_DRIVER_CLASS_NAME=org.postgresql'
      - 'SPRING_FLYWAY_USER=$POSTGRES_USER'
      - 'SPRING_FLYWAY_PASSWORD=$POSTGRES_PASSWORD'
      - 'SPRING_FLYWAY_SCHEMAS=$POSTGRES_DB'
      - 'SPRING_FLYWAY_BASELINE_ON_MIGRATE=true'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=none'
      - 'SPRING_JPA_SHOW_SQL=false'
      - 'SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://moneyflow-database-prod/$POSTGRES_DB'
      - 'JWT_SECRET=$JWT_SECRET'
      - 'JWT_EXPIRATIONMS=$JWT_EXPIRATION_MS'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=$GOOGLE_SECRET'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,profile,email'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=https://$DUCKDNS_SUBDOMAINS.duckdns.org/api/v2/login/oauth2/code/google'
      - 'SPRING_MAIL_HOST=smtp.gmail.com'
      - 'SPRING_MAIL_PORT=587'
      - 'SPRING_MAIL_USERNAME=$MAIL_USERNAME'
      - 'SPRING_MAIL_PASSWORD=$SPRING_MAIL_KEY'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT=5000'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT=5000'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT=5000'
      - 'APP_MAIL_FROM=$MAIL_USERNAME'
      - 'APP_MAIL_FROM_NAME=Moneyflow'
      - 'APP_VERIFICATION_CODE_LENGTH=6'
      - 'APP_VERIFICATION_CODE_EXPIRATION_MINUTES=10'
      - 'APP_VERIFICATION_MAX_ATTEMPTS=3'
      - 'APP_FRONTEND_URL=https://$DUCKDNS_SUBDOMAINS.duckdns.org'
      - 'JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:+TieredCompilation -XX:TieredStopAtLevel=1'
    # sem ports — acessado via NPM internamente
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - moneyflow_properties:/opt/moneyflow/myapp/conf
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          memory: 128M
    networks:
      - backend
      - frontend

  angular:
    container_name: moneyflow-angular-prod
    build:
      dockerfile: Dockerfile
      context: web-front
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 24M
        reservations:
          memory: 12M
    networks:
      - frontend

  app-proxy:
    container_name: moneyflow-proxy-prod
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    ports:
      - '80:80'
      - '443:443'
      # porta 81 não exposta em prod
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - angular
      - api
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          memory: 32M

    networks:
      - frontend
      - backend

  duckdns:
    container_name: moneyflow-duckdns-prod
    image: 'docker.io/linuxserver/duckdns:latest'
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - SUBDOMAINS=$DUCKDNS_SUBDOMAINS
      - TOKEN=$DUCKDNS_TOKEN
      - UPDATE_IP=ipv4
      - LOG_FILE=false
    volumes:
      - ./duckdns:/config
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 16M
        reservations:
          memory: 8M
    networks:
      - frontend

networks:
  backend:
    external: true
  frontend:
    external: true

volumes:
  postgres_data:
  moneyflow_properties: