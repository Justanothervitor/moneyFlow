services:

  database:
    image: 'docker.io/postgres:latest'
    container_name: moneyflow-database-dev
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '$POSTGRES_PORT_EXTERNAL:$POSTGRES_PORT_INTERNAL'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  api:
    container_name: moneyflow-api-dev
    build:
      dockerfile: Dockerfile
      context: ../../Api2.0
    environment:
      - 'SPRING_APPLICATION_NAME=Api2.0'
      - 'SPRING_FLYWAY_DRIVER_CLASS_NAME=org.postgresql'
      - 'SPRING_FLYWAY_USER=$POSTGRES_USER'
      - 'SPRING_FLYWAY_PASSWORD=$POSTGRES_PASSWORD'
      - 'SPRING_FLYWAY_SCHEMAS=$POSTGRES_DB'
      - 'SPRING_FLYWAY_BASELINE_ON_MIGRATE=true'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=update'
      - 'SPRING_JPA_SHOW_SQL=true'
      - 'SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://moneyflow-database-dev/$POSTGRES_DB'
      - 'JWT_SECRET=$JWT_SECRET'
      - 'JWT_EXPIRATIONMS=$JWT_EXPIRATION_MS'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=$GOOGLE_SECRET'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,profile,email'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=$GOOGLE_URL'
      - 'SPRING_MAIL_HOST=smtp.gmail.com'
      - 'SPRING_MAIL_PORT=587'
      - 'SPRING_MAIL_USERNAME=$MAIL_USERNAME'
      - 'SPRING_MAIL_PASSWORD=$SPRING_MAIL_KEY'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT=5000'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT=5000'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT=5000'
      - 'APP_MAIL_FROM=$MAIL_USERNAME'
      - 'APP_MAIL_FROM_NAME=Moneyflow'
      - 'APP_VERIFICATION_CODE_LENGTH=6'
      - 'APP_VERIFICATION_CODE_EXPIRATION_MINUTES=10'
      - 'APP_VERIFICATION_MAX_ATTEMPTS=3'
      - 'APP_FRONTEND_URL=$FRONTEND_URL'
    ports:
      - '8080:8080'
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - moneyflow_properties:/opt/moneyflow/myapp/conf
    networks:
      - backend
      - frontend

  angular:
    container_name: moneyflow-angular-dev
    build:
      dockerfile: Dockerfile
      context: ../../web-front
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - frontend

  app-proxy:
    container_name: moneyflow-proxy-dev
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    ports:
      - '80:80'
      - '81:81'     # painel admin disponível em dev
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - angular
      - api
    networks:
      - frontend
      - backend

  duckdns:
    container_name: moneyflow-duckdns-dev
    image: 'docker.io/linuxserver/duckdns:latest'
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - SUBDOMAINS=$DUCKDNS_SUBDOMAINS
      - TOKEN=$DUCKDNS_TOKEN
      - UPDATE_IP=ipv4
      - LOG_FILE=false
    volumes:
      - ./duckdns:/config
    networks:
      - frontend

networks:
  backend:
    external: true
  frontend:
    external: true

volumes:
  postgres_data:
  moneyflow_properties: